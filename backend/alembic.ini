[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally left blank here -- it's set dynamically
# in alembic/env.py from app.core.config.settings, so migrations always
# use the same DATABASE_URL as the running app instead of a second,
# easy-to-forget copy of the connection string.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
