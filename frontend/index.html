<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliScrape — Job Signals</title>
    <meta
      name="description"
      content="Live job postings from top tech companies, tracked and searchable in one place."
    />

    <!--
      Three-role type system: Space Grotesk (display/headings),
      Inter (body), IBM Plex Mono (data/tags/timestamps).
      Loaded here rather than @import in CSS -- avoids a render-blocking
      request chain (CSS -> @import -> font file) and lets the browser
      start fetching fonts in parallel with everything else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Prevents a "flash of wrong theme" on load: this tiny inline script
      runs before React (or anything else) paints, reading the saved
      preference straight from localStorage and applying the `dark`
      class immediately. Without this, the page would briefly flash
      light mode even for a user who chose dark, because React doesn't
      run until after the initial HTML paints.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("intelliscrape-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage unavailable (e.g. privacy mode) -- default to light, harmless */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
